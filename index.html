<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Ministério de Mídia</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      body {
        padding: 16px;
      }
      .box {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 32px;
        width: 340px;
        max-width: 100%;
      }
      .box h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .box > p {
        margin-bottom: 20px;
        font-size: 13px;
      }
      #erro {
        color: var(--accent);
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <form class="box" id="form">
      <h1>Sistema de Escalas</h1>
      <p>Ministério de Mídia — acesse com seu e-mail cadastrado</p>
      <div class="field">
        <label>E-mail</label><input type="email" id="email" required />
      </div>
      <div class="field">
        <label>Senha</label><input type="password" id="senha" required />
      </div>
      <div id="erro"></div>
      <button class="btn" id="btn" style="width: 100%">Entrar</button>
    </form>
    <script type="module">
      import {
        auth,
        db,
        signInWithEmailAndPassword,
        signOut,
        doc,
        getDoc,
      } from "./firebase.js";

      const PAGINA = {
        sistema: "sistema.html",
        lider: "lider.html",
        voluntario: "voluntario.html",
      };
      const erro = document.getElementById("erro");
      const btn = document.getElementById("btn");

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        erro.textContent = "";
        btn.disabled = true;
        btn.textContent = "Entrando...";
        try {
          const cred = await signInWithEmailAndPassword(
            auth,
            email.value.trim(),
            senha.value,
          );
          const snap = await getDoc(doc(db, "usuarios", cred.user.uid));
          if (!snap.exists()) {
            await signOut(auth);
            throw { code: "sem-perfil" };
          }
          location.href = PAGINA[snap.data().perfil] || "login.html";
        } catch (err) {
          const msgs = {
            "auth/invalid-credential": "E-mail ou senha incorretos.",
            "auth/too-many-requests":
              "Muitas tentativas. Aguarde um pouco e tente de novo.",
            "sem-perfil":
              "Sua conta ainda não tem perfil no sistema. Fale com o admin.",
          };
          erro.textContent =
            msgs[err.code] || "Não foi possível entrar. Tente novamente.";
          btn.disabled = false;
          btn.textContent = "Entrar";
        }
      });
    </script>
  </body>
</html>
